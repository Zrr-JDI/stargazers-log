name: Update starred snapshot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch starred repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github.star+json" \
            "/users/${{ github.repository_owner }}/starred?per_page=100" \
            --jq '[.[] | {starred_at, repo: {name: .repo.full_name, full_name: .repo.full_name, html_url: .repo.html_url, description: .repo.description, language: .repo.language, stargazers_count: .repo.stargazers_count, topics: .repo.topics, archived: .repo.archived, fork: .repo.fork}}]' \
            | jq -s 'add' > events.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh starred snapshot"
          git push
